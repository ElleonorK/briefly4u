name: Bug report
description: Something in the generator, plugin, builder or a generated brief is wrong
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Remove anything private (names, emails, Slack ids, message text) before posting."
  - type: dropdown
    id: target
    attributes:
      label: Target
      options: [Claude Code, Grok Bot, Cursor, Generic, GitHub Actions, Web builder, CLI only]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: "briefly4u version (briefly4u version)" }
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of /briefly4u:doctor (Claude Code), /briefly4u doctor or briefly4u doctor
      render: text
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
